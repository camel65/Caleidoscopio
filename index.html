<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caleidoscopio de Gemas y Anillo Mutante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: default;
        }

        /* Botón de Inicio */
        #btn-inicio {
            padding: 18px 45px;
            font-size: 1.6rem;
            color: #00ffcc;
            background: transparent;
            border: 2px solid #00ffcc;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            z-index: 10;
        }

        #btn-inicio:hover {
            background-color: #00ffcc;
            color: #000000;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.9);
            transform: scale(1.08);
        }

        /* Controles flotantes */
        .controles {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            gap: 12px;
            z-index: 20;
        }

        .btn-control {
            padding: 10px 22px;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: #00ffcc;
            color: #000000;
            border-color: #00ffcc;
            transform: scale(1.05);
        }

        #btn-salir:hover {
            background: rgba(255, 0, 85, 0.9);
            border-color: #ff0055;
            color: #ffffff;
        }

        /* Contenedor del lienzo */
        #canvas-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Botón de Inicio -->
    <button id="btn-inicio">Inicio</button>

    <!-- Controles flotantes -->
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>

    <!-- Contenedor del lienzo -->
    <div id="canvas-container">
        <canvas id="joyasCaleidoscopioCanvas"></canvas>
    </div>

    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('joyasCaleidoscopioCanvas');
        const ctx = canvas.getContext('2d');

        let animacionId = null;
        let activo = false;
        let anguloGlobal = 0;
        let mouseX = 0;
        let mouseY = 0;
        let gemas = [];
        let figurasAnillo = [];
        let matizBase = 180;
        const numeroSegmentos = 8; 

        // Variables de Audio (Volumen Máximo)
        let audioCtx = null;
        let audioActivo = true;
        let masterGain = null;
        let compresor = null;
        let filtro = null;
        let tiempoBucleMusica = null;
        let pasoRitmo = 0;

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mouseX = 0;
            mouseY = 0;
        }

        window.addEventListener('resize', ajustarCanvas);

        window.addEventListener('mousemove', (e) => {
            if (!activo) return;
            mouseX = e.clientX - canvas.width / 2;
            mouseY = e.clientY - canvas.height / 2;
        });

        window.addEventListener('click', () => {
            if (!activo) return;
            matizBase = (matizBase + 50) % 360;
            generarElementos();
        });

        function generarElementos() {
            gemas = [];
            figurasAnillo = [];

            // Generar gemas y diamantes para el interior
            for (let i = 0; i < 18; i++) {
                gemas.push({
                    x: (Math.random() - 0.5) * 260,
                    y: (Math.random() - 0.5) * 260,
                    tamano: Math.random() * 30 + 15,
                    velocidadX: (Math.random() - 0.5) * 4,
                    velocidadY: (Math.random() - 0.5) * 4,
                    tipoGema: Math.floor(Math.random() * 3), // 0: Diamante, 1: Rubí/Gema facetada, 2: Cristal puntiagudo
                    desfase: Math.random() * Math.PI * 2
                });
            }

            // Generar figuras mutantes para el anillo exterior
            for (let i = 0; i < 16; i++) {
                figurasAnillo.push({
                    anguloOrbita: (i * Math.PI * 2) / 16,
                    radioOrbita: 0, // Se calculará dinámicamente según el tamaño del círculo
                    velocidadOrbita: (i % 2 === 0 ? 1 : -1) * 0.015,
                    tipoActual: Math.floor(Math.random() * 4),
                    escala: Math.random() * 0.5 + 0.8
                });
            }
        }

        // --- SISTEMA DE AUDIO ARPEGIADO (Volumen Máximo) ---
        function reproducirMusicaGemas() {
            if (!audioActivo || !audioCtx || audioCtx.state !== 'running' || !activo) return;

            const tiempoActual = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; // Sonido limpio y brillante como cristales

            const escalaArpegio = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
            let freq = escalaArpegio[pasoRitmo % escalaArpegio.length];

            if (pasoRitmo % 3 === 0) freq *= 1.2;

            osc.frequency.setValueAtTime(freq, tiempoActual);

            gain.gain.setValueAtTime(1.0, tiempoActual);
            gain.gain.exponentialRampToValueAtTime(0.001, tiempoActual + 0.22);

            osc.connect(gain);
            gain.connect(filtro);
            osc.start(tiempoActual);
            osc.stop(tiempoActual + 0.23);

            pasoRitmo++;
            tiempoBucleMusica = setTimeout(reproducirMusicaGemas, 140);
        }

        function iniciarMusica() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(audioActivo ? 1.0 : 0, audioCtx.currentTime);

            compresor = audioCtx.createDynamicsCompressor();
            compresor.threshold.setValueAtTime(-15, audioCtx.currentTime);
            compresor.ratio.setValueAtTime(12, audioCtx.currentTime);

            filtro = audioCtx.createBiquadFilter();
            filtro.type = 'lowpass';
            filtro.frequency.setValueAtTime(3200, audioCtx.currentTime);

            filtro.connect(compresor);
            compresor.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            pasoRitmo = 0;
            reproducirMusicaGemas();
        }

        function detenerMusica() {
            if (tiempoBucleMusica) clearTimeout(tiempoBucleMusica);
            tiempoBucleMusica = null;
            if (masterGain && audioCtx) {
                masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            }
        }

        btnAudio.addEventListener('click', () => {
            audioActivo = !audioActivo;
            btnAudio.textContent = audioActivo ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(audioActivo ? 1.0 : 0, audioCtx.currentTime);
                if (audioActivo && activo && !tiempoBucleMusica) {
                    reproducirMusicaGemas();
                }
            }
        });

        // --- CONTROLES DE PÁGINA ---
        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'block';
            
            ajustarCanvas();
            generarElementos();
            activo = true;

            iniciarAnimacion();
            iniciarMusica();
        });

        btnSalir.addEventListener('click', () => {
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);
            detenerMusica();

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Función para dibujar una Gema / Diamante facetado
        function dibujarGema(x, y, tam, tipo, colorMatiz) {
            ctx.save();
            ctx.translate(x, y);

            ctx.strokeStyle = `hsl(${colorMatiz}, 100%, 75%)`;
            ctx.fillStyle = `hsla(${colorMatiz}, 100%, 60%, 0.35)`;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 14;
            ctx.shadowColor = `hsl(${colorMatiz}, 100%, 50%)`;

            if (tipo === 0) {
                // Diamante clásico
                ctx.beginPath();
                ctx.moveTo(0, -tam);
                ctx.lineTo(tam * 0.7, -tam * 0.3);
                ctx.lineTo(tam * 0.5, tam);
                ctx.lineTo(-tam * 0.5, tam);
                ctx.lineTo(-tam * 0.7, -tam * 0.3);
                ctx.closePath();
                ctx.stroke();
                ctx.fill();

                // Facetas internas del diamante
                ctx.beginPath();
                ctx.moveTo(0, -tam);
                ctx.lineTo(0, tam);
                ctx.moveTo(-tam * 0.7, -tam * 0.3);
                ctx.lineTo(tam * 0.7, -tam * 0.3);
                ctx.stroke();
            } else if (tipo === 1) {
                // Gema octagonal / Piedra preciosa
                ctx.beginPath();
                ctx.moveTo(-tam * 0.4, -tam);
                ctx.lineTo(tam * 0.4, -tam);
                ctx.lineTo(tam, -tam * 0.4);
                ctx.lineTo(tam, tam * 0.4);
                ctx.lineTo(tam * 0.4, tam);
                ctx.lineTo(-tam * 0.4, tam);
                ctx.lineTo(-tam, tam * 0.4);
                ctx.lineTo(-tam, -tam * 0.4);
                ctx.closePath();
                ctx.stroke();
                ctx.fill();
            } else {
                // Cristal alargado brillante
                ctx.beginPath();
                ctx.moveTo(0, -tam * 1.3);
                ctx.lineTo(tam * 0.5, -tam * 0.4);
                ctx.lineTo(tam * 0.5, tam * 0.8);
                ctx.lineTo(0, tam * 1.3);
                ctx.lineTo(-tam * 0.5, tam * 0.8);
                ctx.lineTo(-tam * 0.5, -tam * 0.4);
                ctx.closePath();
                ctx.stroke();
                ctx.fill();
            }

            ctx.restore();
        }

        // Función para dibujar figuras mutantes exteriores
        function dibujarFiguraMutante(x, y, tipo, tam, colorMatiz, tiempo) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(tiempo);

            ctx.strokeStyle = `hsl(${colorMatiz}, 100%, 80%)`;
            ctx.fillStyle = `hsla(${colorMatiz}, 100%, 50%, 0.4)`;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `hsl(${colorMatiz}, 100%, 60%)`;

            let mutacionTipo = Math.floor((tiempo * 2 + tipo) % 4);

            if (mutacionTipo === 0) {
                // Triángulo rotativo
                ctx.beginPath();
                ctx.moveTo(0, -tam);
                ctx.lineTo(tam, tam);
                ctx.lineTo(-tam, tam);
                ctx.closePath();
                ctx.stroke();
            } else if (mutacionTipo === 1) {
                // Cuadrado giratorio
                ctx.strokeRect(-tam * 0.7, -tam * 0.7, tam * 1.4, tam * 1.4);
            } else if (mutacionTipo === 2) {
                // Estrella de 4 puntas
                ctx.beginPath();
                ctx.moveTo(0, -tam);
                ctx.lineTo(tam * 0.3, -tam * 0.3);
                ctx.lineTo(tam, 0);
                ctx.lineTo(tam * 0.3, tam * 0.3);
                ctx.lineTo(0, tam);
                ctx.lineTo(-tam * 0.3, tam * 0.3);
                ctx.lineTo(-tam, 0);
                ctx.lineTo(-tam * 0.3, -tam * 0.3);
                ctx.closePath();
                ctx.stroke();
            } else {
                // Hexágono
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let ang = (i * Math.PI) / 3;
                    let px = Math.cos(ang) * tam;
                    let py = Math.sin(ang) * tam;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.fill();
            }

            ctx.restore();
        }

        // --- BUCLE DE ANIMACIÓN ---
        function iniciarAnimacion() {
            if (!activo) return;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centroX = canvas.width / 2;
            const centroY = canvas.height / 2;
            const radioVisor = Math.min(canvas.width, canvas.height) * 0.38;

            anguloGlobal += 0.02;

            // 1. --- DIBUJAR ANILLO PERIFÉRICO DE FIGURAS MUTANTES (ALREDEDOR DEL CÍRCULO) ---
            let radioAnillo = radioVisor + 35;
            for (let i = 0; i < figurasAnillo.length; i++) {
                let f = figurasAnillo[i];
                f.anguloOrbita += f.velocidadOrbita;

                let fx = centroX + Math.cos(f.anguloOrbita) * radioAnillo;
                let fy = centroY + Math.sin(f.anguloOrbita) * radioAnillo;

                let colorMatizAnillo = (matizBase + i * 25 + anguloGlobal * 30) % 360;
                dibujarFiguraMutante(fx, fy, f.tipoActual, 14 * f.escala, colorMatizAnillo, anguloGlobal + i);
            }

            // 2. --- CONTENEDOR CIRCULAR DEL CALEIDOSCOPIO DE GEMAS ---
            ctx.save();
            ctx.beginPath();
            ctx.arc(centroX, centroY, radioVisor, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            ctx.fillStyle = '#030303';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(centroX, centroY);

            let anguloSegmento = (Math.PI * 2) / numeroSegmentos;

            for (let i = 0; i < numeroSegmentos; i++) {
                ctx.save();
                ctx.rotate(i * anguloSegmento + anguloGlobal);

                if (i % 2 === 1) {
                    ctx.scale(1, -1);
                }

                // Recorte de cuña triangular simétrica
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radioVisor * 1.5, -anguloSegmento / 2, anguloSegmento / 2);
                ctx.closePath();
                ctx.clip();

                // Actualizar y dibujar gemas y diamantes
                for (let j = 0; j < gemas.length; j++) {
                    let g = gemas[j];
                    g.x += g.velocidadX;
                    g.y += g.velocidadY;

                    if (Math.abs(g.x) > 150) g.velocidadX *= -1;
                    if (Math.abs(g.y) > 150) g.velocidadY *= -1;

                    let factorMouseX = mouseX * 0.05;
                    let factorMouseY = mouseY * 0.05;

                    let colorGemaMatiz = (matizBase + (j * 20) + (anguloGlobal * 45)) % 360;
                    dibujarGema(g.x + factorMouseX, g.y + factorMouseY, g.tamano, g.tipoGema, colorGemaMatiz);
                }

                ctx.restore();
            }

            ctx.restore();
            ctx.restore(); // Fin del recorte circular

            // 3. --- ANILLO EXTERIOR LUMINOSO DEL VISOR ---
            ctx.beginPath();
            ctx.arc(centroX, centroY, radioVisor, 0, Math.PI * 2);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();
            ctx.shadowBlur = 0;

            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
